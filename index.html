async function sincronizarConNube() {

    const datosParaSubir = {
        participantes: dbParticipantes,
        goles: dbGoles,
        llavesManual: dbLlavesManual
    };

    try {
        await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify(datosParaSubir)
            }
        );

        console.log("Datos guardados en nube");

    } catch (error) {
        console.error(error);
    }
}

async function descargarDesdeNube() {

    try {

      const response = await fetch(
    `https://api.jsonbin.io/v3/b/${BIN_ID}?t=${Date.now()}`,
    {
        method: "GET",
        cache: "no-store",
        headers: {
            "X-Master-Key": MASTER_KEY
        }
    }
);
        const datos = await response.json();

        if (datos.record) {
            dbParticipantes = datos.record.participantes || [];
            dbGoles = datos.record.goles || {};
            dbLlavesManual = datos.record.llavesManual || {};
            
            localStorage.setItem('bosch_participantes', JSON.stringify(dbParticipantes));
            localStorage.setItem('bosch_goles', JSON.stringify(dbGoles));
            localStorage.setItem('bosch_llaves_manual', JSON.stringify(dbLlavesManual));
        }

    } catch (error) {
        console.error(error);
    }
}

        function toggleAdminMode() {
    if (!esAdmin) {
        let intento = prompt("Introduce el PIN de Administrador:");

        if (intento === PIN_ADMIN) {
            esAdmin = true;

            const adminStatus = document.getElementById('admin-status');
            const btnLock = document.getElementById('btn-lock');
            const adminTools = document.getElementById("admin-tools");

            if (adminStatus) adminStatus.textContent = "🔓 Modo Administrador Activo";
            if (btnLock) {
                btnLock.textContent = "Bloquear";
                btnLock.classList.add('unlocked');
            }
            if (adminTools) adminTools.style.display = "block";

        } else {
            alert("PIN Incorrecto.");
        }

    } else {
        esAdmin = false;

        const adminStatus = document.getElementById('admin-status');
        const btnLock = document.getElementById('btn-lock');
        const adminTools = document.getElementById("admin-tools");

        if (adminStatus) adminStatus.textContent = "🔒 Modo Lectura (Registros bloqueados)";

            btnLock.textContent = "Desbloquear";
            btnLock.classList.remove('unlocked');
        }
        if (adminTools) adminTools.style.display = "none";
    }

    actualizarPermisosRegistro();
}

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('btn-tab-' + tab).classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
            if (tab === 'registro') { 
                actualizarPermisosRegistro();
                actualizarSelectEquipos(); 
                renderListaAsignados(); 
            }
            if (tab === 'grupos') construirMenuGrupos();
            if (tab === 'eliminatorias') verFaseEliminatoria(0);
        }

        function actualizarPermisosRegistro() {
            const nombre = document.getElementById('nombre-input');
            const equipo = document.getElementById('equipo-select');
            const boton = document.querySelector('#panel-registro .main-btn');
            if(nombre) nombre.disabled = !esAdmin;
            if(equipo) equipo.disabled = !esAdmin;
            if(boton) boton.disabled = !esAdmin;
        }

        
        document.getElementById('btn-tab-registro').style.display = 'none'; 
        document.getElementById('btn-tab-registro').addEventListener('click', () => switchTab('registro'));
        document.getElementById('btn-tab-grupos').addEventListener('click', () => switchTab('grupos'));
        document.getElementById('btn-tab-eliminatorias').addEventListener('click', () => switchTab('eliminatorias'));

        function buscarGrupoDeEquipo(equipo) {
            for (let g in mapaGrupos) if (mapaGrupos[g].indexOf(equipo) >= 0) return g;
            return "";
        }

        function actualizarSelectEquipos() {
            const select = document.getElementById('equipo-select');
            select.innerHTML = '<option value="" disabled selected>🔽 Toca aquí para elegir país...</option>';
            const ocupados = dbParticipantes.map(p => p.equipo);
            const disponibles = todosLosEquipos.filter(e => ocupados.indexOf(e) < 0);
            if (disponibles.length === 0) { select.innerHTML = '<option value="" disabled selected>✅ Todos los equipos asignados</option>'; return; }
            disponibles.forEach(eq => { select.innerHTML += `<option value="${eq}">${obtenerBandera(eq)} ${eq} (${buscarGrupoDeEquipo(eq)})</option>`; });
        }

        function registrarPapelito() {
            const nombre = document.getElementById('nombre-input').value.trim();
            const equipo = document.getElementById('equipo-select').value;
            if (!nombre || !equipo) return alert("Faltan datos.");
            dbParticipantes.push({ nombre: nombre, equipo: equipo, grupo: buscarGrupoDeEquipo(equipo) });sincronizarConNube();
            localStorage.setItem('bosch_participantes', JSON.stringify(dbParticipantes));
            document.getElementById('nombre-input').value = "";
            actualizarSelectEquipos();
            renderListaAsignados();
        }

        function eliminarParticipante(equipo, nombre) {
            if(confirm(`¿Dar de baja a ${nombre}?`)) {
                dbParticipantes = dbParticipantes.filter(p => p.equipo !== equipo);
                localStorage.setItem('bosch_participantes', JSON.stringify(dbParticipantes));sincronizarConNube();
                actualizarSelectEquipos();
                renderListaAsignados();
            }
        }

        function renderListaAsignados() {
            const cont = document.getElementById('tabla-asignados');
            cont.innerHTML = dbParticipantes.length === 0 ? "<div style='text-align:center; padding:10px;'>Vacío</div>" : "";
            [...dbParticipantes].reverse().forEach(p => {
                let btnHtml = esAdmin ? `<button class="btn-eliminar" onclick="eliminarParticipante('${p.equipo}', '${p.nombre}')" title="Dar de baja">🗑️</button>` : "";
                cont.innerHTML += `
                    <div class="participante-item">
                        <div><strong>${p.nombre}</strong> <span style="color:var(--secondary)">⚽ ${obtenerBandera(p.equipo)} ${p.equipo}</span></div>
                        ${btnHtml}
                    </div>
                `;
            });
        }

        function construirMenuGrupos() {
            const grid = document.getElementById('menu-grupos-grid');
            grid.innerHTML = "";

        function calcularStatsGrupo(grupo, teams) {
            let stats = teams.map(t => ({ nombre: t, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, dif: 0, pts: 0 }));
            let partidos = obtenerPartidosDeGrupo(teams);
            partidos.forEach((p, idx) => {
                let gl = dbGoles[`${grupo}_p${idx}_L`];
                let gv = dbGoles[`${grupo}_p${idx}_V`];
                if (gl !== undefined && gv !== undefined) {
                    let sLoc = stats.find(s => s.nombre === p.l);
                    let sVis = stats.find(s => s.nombre === p.v);
                    sLoc.pj++; sVis.pj++; sLoc.gf += gl; sLoc.gc += gv; sVis.gf += gv; sVis.gc += gl;
                    if (gl > gv) { sLoc.pts += 3; sLoc.g++; sVis.p++; } else if (gv > gl) { sVis.pts += 3; sVis.g++; sLoc.p++; } else { sLoc.pts += 1; sVis.pts += 1; sLoc.e++; sVis.e++; }
                }
            });
            stats.forEach(s => s.dif = s.gf - s.gc);
            stats.sort((a, b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.dif !== a.dif) ? b.dif - a.dif : b.gf - a.gf);
            return stats;
        }

        function renderTablaGrupo(grupo, teams) {
            let stats = calcularStatsGrupo(grupo, teams);
            const tbody = document.getElementById('dinamico-cuerpo-tabla');
            tbody.innerHTML = "";
            stats.forEach((s, i) => {
                tbody.innerHTML += `<tr><td style="color:#64748b; font-weight:bold;">${i + 1}</td><td class="col-eq">${obtenerDueñoObj(s.nombre)} <span class="dueño-label-tabla">${obtenerBandera(s.nombre)} ${s.nombre}</span></td><td>${s.pj}</td> <td>${s.g}</td> <td>${s.e}</td> <td>${s.p}</td><td>${s.gf}</td> <td>${s.gc}</td> <td>${s.dif > 0 ? '+'+s.dif : s.dif}</td><td class="col-pts">${s.pts}</td></tr>`;
            });
        }

        function obtener32Clasificados() {
            let directos = [], terceros = [];
            for (let g in mapaGrupos) {
                let tabla = calcularStatsGrupo(g, mapaGrupos[g]);
                directos.push(tabla[0], tabla[1]);
                terceros.push(tabla[2]);
            }
            terceros.sort((a,b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.dif !== a.dif) ? b.dif - a.dif : b.gf - a.gf);
            let todos = [...directos, ...terceros.slice(0, 8)];
            todos.sort((a,b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.dif !== a.dif) ? b.dif - a.dif : b.gf - a.gf);
            return todos;
        }

        const semillas32 = [1,32, 16,17, 9,24, 8,25, 4,29, 13,20, 12,21, 5,28, 2,31, 15,18, 10,23, 7,26, 3,30, 14,19, 11,22, 6,27];

        function obtenerGanadorBracket(faseIdx, matchIdx) {
            if (faseIdx === -1) {
                let clasificados = obtener32Clasificados();
                return clasificados[semillas32[matchIdx] - 1]; 
            }
            let gL = dbGoles[`elim_${faseIdx}_p${matchIdx}_L`];
            let gV = dbGoles[`elim_${faseIdx}_p${matchIdx}_V`];
            if (gL !== undefined && gV !== undefined) {
                if (gL > gV) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2);
                if (gV > gL) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2 + 1);
                if (gL === gV) {
                    let pL = dbGoles[`elim_${faseIdx}_p${matchIdx}_L_pen`];
                    let pV = dbGoles[`elim_${faseIdx}_p${matchIdx}_V_pen`];
                    if (pL > pV) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2);
                    if (pV > pL) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2 + 1);
                }
            }
            return null; 
        }

        function convertirFechaPartido(fechaStr, horaStr) {

    const meses = {
        Jan:0, Feb:1, Mar:2, Apr:3,
        May:4, Jun:5, Jul:6, Aug:7,
        Sep:8, Oct:9, Nov:10, Dec:11
    };

    const partes = fechaStr.split("-");
    const dia = parseInt(partes[0]);
    const mes = meses[partes[1]];
    const anio = 2000 + parseInt(partes[2]);

    const hora = horaStr.split(":");

    return new Date(
        anio,
        mes,
        dia,
        parseInt(hora[0]),
        parseInt(hora[1]),
        0
    );
}

function obtenerEstadoPartido(fechaStr, horaStr, gl = null, gv = null) {

    if (!fechaStr || !horaStr) return "";

    const ahora = new Date();
    const inicio = convertirFechaPartido(fechaStr, horaStr);

    // Duración estimada del partido
    const fin = new Date(inicio.getTime() + (2 * 60 * 60 * 1000));

    const diferencia = inicio - ahora;

    // Antes de iniciar
    if (diferencia > 0) {

        const dias = Math.floor(diferencia / 86400000);
        const horas = Math.floor((diferencia % 86400000) / 3600000);
        const minutos = Math.floor((diferencia % 3600000) / 60000);
        const segundos = Math.floor((diferencia % 60000) / 1000);

        return `
        <div class="estado-partido estado-previo">
            ⏳ Inicia en:<br>
            ${dias}d ${horas}h ${minutos}m ${segundos}s
        </div>`;
    }

    // Durante el partido
    if (ahora >= inicio && ahora <= fin) {

        return `
        <div class="estado-partido estado-vivo">
            🔴 EN JUEGO
        </div>`;
    }

    // Si ya capturaste resultado
    if (gl !== "" && gl !== null &&
        gv !== "" && gv !== null &&
        gl !== undefined &&
        gv !== undefined) {

        return `
        <div class="estado-partido estado-vivo">
            ✅ PARTIDO FINALIZADO
        </div>`;
    }

    // Terminó pero aún no capturas resultado
    return `
    <div class="estado-partido estado-finalizado">
        🟡 ESPERANDO RESULTADOS
    </div>`;
}

    window.open(url, "_blank");
}

async function iniciarApp() {
    console.log("Iniciando carga de datos...");
    await descargarDesdeNube();
    
    dbParticipantes = dbParticipantes || [];
    dbGoles = dbGoles || {};
    dbLlavesManual = dbLlavesManual || {};
    
    actualizarSelectEquipos();
    renderListaAsignados();
    construirMenuGrupos();
    
    actualizarRelojGlobal();
        
    console.log("¡Quiniela sincronizada y lista!");
}
    setInterval(() => {

    actualizarRelojGlobal();
    mostrarProximosPartidos();

    if (document.activeElement.tagName === "INPUT") {
        return;
    }

    if (document.getElementById('panel-grupos').classList.contains('active')) {
        cargarDetalleGrupo(grupoSeleccionadoGlobal);
    }

    if (document.getElementById('panel-eliminatorias').classList.contains('active')) {
        verFaseEliminatoria(faseEliminatoriaGlobal);
    }

}, 1000);
// Ejecutamos la app
iniciarApp().catch(err => {
    console.error("Error al cargar la quiniela: ", err);
    alert("Hubo un problema al conectar con el servidor. Revisa tu conexión.");
});
    </script>
