const MASTER_KEY = k1 + k2 + k3 + k4 + k5 + k6;

async function sincronizarConNube() {

    const datosParaSubir = {
        participantes: dbParticipantes,
        goles: dbGoles,
        llavesManual: dbLlavesManual
    };

    try {
        await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify(datosParaSubir)
            }
        );

        console.log("Datos guardados en nube");

    } catch (error) {
        console.error(error);
    }
}

async function descargarDesdeNube() {

    try {

        const respuesta = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
            {
                headers: {
                    "X-Master-Key": MASTER_KEY
                }
            }
        );

        const datos = await respuesta.json();

        if (datos.record) {
            dbParticipantes = datos.record.participantes || [];
            dbGoles = datos.record.goles || {};
            dbLlavesManual = datos.record.llavesManual || {};
            
            localStorage.setItem('bosch_participantes', JSON.stringify(dbParticipantes));
            localStorage.setItem('bosch_goles', JSON.stringify(dbGoles));
            localStorage.setItem('bosch_llaves_manual', JSON.stringify(dbLlavesManual));
        }

    } catch (error) {
        console.error(error);
    }
}

            const select = document.getElementById('equipo-select');
            select.innerHTML = '<option value="" disabled selected>🔽 Toca aquí para elegir país...</option>';
            const ocupados = dbParticipantes.map(p => p.equipo);
            const disponibles = todosLosEquipos.filter(e => ocupados.indexOf(e) < 0);
            if (disponibles.length === 0) { select.innerHTML = '<option value="" disabled selected>✅ Todos los equipos asignados</option>'; return; }
            disponibles.forEach(eq => { select.innerHTML += `<option value="${eq}">${obtenerBandera(eq)} ${eq} (${buscarGrupoDeEquipo(eq)})</option>`; });

        function editarLlave(fase, partido) {

    let actual = dbLlavesManual[`${fase}_${partido}`] || {};

    let local = prompt(
        "Equipo local:",
        actual.local || ""
    );

    if (local === null) return;

    let visita = prompt(
        "Equipo visitante:",
        actual.visita || ""
    );

    if (visita === null) return;

    guardarLlaveManual(
        fase,
        partido,
        local,
        visita
    );

    verFaseEliminatoria(fase);
}

function cargarDetalleGrupo(grupo) {
    const teams = mapaGrupos[grupo];
    const partidos = obtenerPartidosDeGrupo(teams);
    const cont = document.getElementById('dinamico-lista-partidos');
    cont.innerHTML = "";

    partidos.forEach((p, idx) => {
        const info = calendarioCompleto[grupo] && calendarioCompleto[grupo][idx] 
                     ? calendarioCompleto[grupo][idx] 
                     : {fecha:'Por definir', hora:'', local:p.l, visita:p.v, estadio: 'Por asignar'};
        
        let gl = dbGoles[`${grupo}_p${idx}_L`] ?? "";
        let gv = dbGoles[`${grupo}_p${idx}_V`] ?? "";
        // El modo edición solo está habilitado si es administrador
        let est = esAdmin ? "" : "disabled";

        cont.innerHTML += `
            <div class="partido-row">
               <div class="partido-meta">
                    <div>⏰ ${info.hora || ''}</div>
                    <div>📅 ${info.fecha || 'N/A'}</div>
                    <div>🏟️ ${info.estadio || 'Por asignar'}</div>
                </div>
                <div class="partido-equipos">
                    <div class="equipo-nombre local">
                        <div class="nombre-jugador">${obtenerDueñoObj(p.l)}</div>
                        <div class="nombre-pais">${obtenerBandera(p.l)} ${p.l}</div>
                    </div>
                    <div class="marcador-container">
                        <div class="marcador">
                            <input type="number" value="${gl}" ${est} oninput="guardarGol('${grupo}', ${idx}, 'L', this.value)">
                            <span style="color:#64748b; font-size:12px;">VS</span>
                            <input type="number" value="${gv}" ${est} oninput="guardarGol('${grupo}', ${idx}, 'V', this.value)">
                        </div>
                    </div>
                    <div class="equipo-nombre visita">
                        <div class="nombre-jugador">${obtenerDueñoObj(p.v)}</div>
                        <div class="nombre-pais">${p.v} ${obtenerBandera(p.v)}</div>
                    </div>
                </div>
            </div>`;
    }); 
    renderTablaGrupo(grupo, teams);
}

        function guardarGol(g, idx, lado, val) {
            let key = `${g}_p${idx}_${lado}`;
            if (val === "") delete dbGoles[key]; else dbGoles[key] = parseInt(val);
            localStorage.setItem('bosch_goles', JSON.stringify(dbGoles));sincronizarConNube();
            renderTablaGrupo(g, mapaGrupos[g]);
        }

        function calcularStatsGrupo(grupo, teams) {
            let stats = teams.map(t => ({ nombre: t, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, dif: 0, pts: 0 }));
            let partidos = obtenerPartidosDeGrupo(teams);
            partidos.forEach((p, idx) => {
                let gl = dbGoles[`${grupo}_p${idx}_L`];
                let gv = dbGoles[`${grupo}_p${idx}_V`];
                if (gl !== undefined && gv !== undefined) {
                    let sLoc = stats.find(s => s.nombre === p.l);
                    let sVis = stats.find(s => s.nombre === p.v);
                    sLoc.pj++; sVis.pj++; sLoc.gf += gl; sLoc.gc += gv; sVis.gf += gv; sVis.gc += gl;
                    if (gl > gv) { sLoc.pts += 3; sLoc.g++; sVis.p++; } else if (gv > gl) { sVis.pts += 3; sVis.g++; sLoc.p++; } else { sLoc.pts += 1; sVis.pts += 1; sLoc.e++; sVis.e++; }
                }
            });
            stats.forEach(s => s.dif = s.gf - s.gc);
            stats.sort((a, b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.dif !== a.dif) ? b.dif - a.dif : b.gf - a.gf);
            return stats;
        }

        function renderTablaGrupo(grupo, teams) {
            let stats = calcularStatsGrupo(grupo, teams);
            const tbody = document.getElementById('dinamico-cuerpo-tabla');
            tbody.innerHTML = "";
            stats.forEach((s, i) => {
                tbody.innerHTML += `<tr><td style="color:#64748b; font-weight:bold;">${i + 1}</td><td class="col-eq">${obtenerDueñoObj(s.nombre)} <span class="dueño-label-tabla">${obtenerBandera(s.nombre)} ${s.nombre}</span></td><td>${s.pj}</td> <td>${s.g}</td> <td>${s.e}</td> <td>${s.p}</td><td>${s.gf}</td> <td>${s.gc}</td> <td>${s.dif > 0 ? '+'+s.dif : s.dif}</td><td class="col-pts">${s.pts}</td></tr>`;
            });
        }

        function obtener32Clasificados() {
            let directos = [], terceros = [];
            for (let g in mapaGrupos) {
                let tabla = calcularStatsGrupo(g, mapaGrupos[g]);
                directos.push(tabla[0], tabla[1]);
                terceros.push(tabla[2]);
            }
            terceros.sort((a,b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.dif !== a.dif) ? b.dif - a.dif : b.gf - a.gf);
            let todos = [...directos, ...terceros.slice(0, 8)];
            todos.sort((a,b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.dif !== a.dif) ? b.dif - a.dif : b.gf - a.gf);
            return todos;
        }

        const semillas32 = [1,32, 16,17, 9,24, 8,25, 4,29, 13,20, 12,21, 5,28, 2,31, 15,18, 10,23, 7,26, 3,30, 14,19, 11,22, 6,27];

        function obtenerGanadorBracket(faseIdx, matchIdx) {
            if (faseIdx === -1) {
                let clasificados = obtener32Clasificados();
                return clasificados[semillas32[matchIdx] - 1]; 
            }
            let gL = dbGoles[`elim_${faseIdx}_p${matchIdx}_L`];
            let gV = dbGoles[`elim_${faseIdx}_p${matchIdx}_V`];
            if (gL !== undefined && gV !== undefined) {
                if (gL > gV) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2);
                if (gV > gL) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2 + 1);
                if (gL === gV) {
                    let pL = dbGoles[`elim_${faseIdx}_p${matchIdx}_L_pen`];
                    let pV = dbGoles[`elim_${faseIdx}_p${matchIdx}_V_pen`];
                    if (pL > pV) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2);
                    if (pV > pL) return obtenerGanadorBracket(faseIdx - 1, matchIdx * 2 + 1);
                }
            }
            return null; 
        }

        function guardarGolEliminatoria(fase, matchIdx, lado, val, isPenal = false) {

    let key = `elim_${fase}_p${matchIdx}_${lado}${isPenal ? '_pen' : ''}`;

    if (val === "") {
        delete dbGoles[key];
    } else {
        dbGoles[key] = parseInt(val);
    }

    localStorage.setItem('bosch_goles', JSON.stringify(dbGoles));

    sincronizarConNube();

    verFaseEliminatoria(fase);
}

        function verFaseEliminatoria(faseIdx) {
            faseEliminatoriaGlobal = faseIdx;
            document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-fase-' + faseIdx).classList.add('active');
            let nombreLlaves = ["Clasificados", "Octavos de Final", "Cuartos de Final", "Semifinal", "Gran Final"];
            let numMatches = [16, 8, 4, 2, 1][faseIdx];
            const cont = document.getElementById('lista-partidos-eliminatorias');
            cont.innerHTML = "";
            for (let i = 0; i < numMatches; i++) {
                const info = calendarioEliminatorias[faseIdx]?.[i] || {};
                let override = dbLlavesManual[`${faseIdx}_${i}`];

let equipoL = override
    ? { nombre: override.local }
    : obtenerGanadorBracket(faseIdx - 1, i * 2);

let equipoV = override
    ? { nombre: override.visita }
    : obtenerGanadorBracket(faseIdx - 1, i * 2 + 1);
                
                
                let gl = dbGoles[`elim_${faseIdx}_p${i}_L`] ?? "";
let gv = dbGoles[`elim_${faseIdx}_p${i}_V`] ?? "";
let est = (esAdmin && equipoL && equipoV) ? "" : "disabled";

let penalesHTML = (gl !== "" && gv !== "" && gl === gv) ? `
    <div class="penales-box"><span>Penales:</span>
        <input type="number" value="${dbGoles[`elim_${faseIdx}_p${i}_L_pen`] ?? ""}" ${est} oninput="guardarGolEliminatoria(${faseIdx}, ${i}, 'L', this.value, true)">
        <span>-</span>
        <input type="number" value="${dbGoles[`elim_${faseIdx}_p${i}_V_pen`] ?? ""}" ${est} oninput="guardarGolEliminatoria(${faseIdx}, ${i}, 'V', this.value, true)">
    </div>` : "";
                
                let botonesAdmin = esAdmin ? `
<div style="margin-top:8px;text-align:center;">
    <button onclick="editarLlave(${faseIdx},${i})">
        ✏️ Corregir
    </button>

    <button onclick="eliminarLlaveManual(${faseIdx},${i})">
        🗑️ Quitar
    </button>
</div>
` : "";
                
                cont.innerHTML += `
    <div class="partido-row" style="${(equipoL && equipoV) ? "" : "opacity: 0.5;"}">




<div class="partido-meta">
    <div>⏰ ${info.hora || ''}</div>
    <div>📅 ${info.fecha || ''}</div>
    <div>🏟️ ${info.estadio || 'Por definir'}</div>
    <div>🔥 Llave ${i + 1} • ${nombreLlaves[faseIdx]}</div>
${override ? '<div style="color:#f59e0b;font-weight:bold;">🔧 Ajustada por Administrador</div>' : ''}
</div>

        <div class="partido-equipos">
            
           <div class="equipo-nombre local">
    <div class="nombre-jugador" style="color: #22c55e;">${obtenerDueñoObj(equipoL?.nombre) ?? "SIN ASIGNAR"}</div>
    <div class="nombre-pais" style="color: #64748b;">${equipoL ? obtenerBandera(equipoL.nombre) : ""} ${equipoL?.nombre ?? "???"}</div>
</div>
                         

<div class="marcador-container">
    <div class="marcador">
        <input type="number" value="${gl}" ${est} oninput="guardarGolEliminatoria(${faseIdx}, ${i}, 'L', this.value)">
        <span style="color:#64748b; font-size:12px;">VS</span>
        <input type="number" value="${gv}" ${est} oninput="guardarGolEliminatoria(${faseIdx}, ${i}, 'V', this.value)">
    </div>
    ${penalesHTML}
</div>
                          
                          
            <div class="equipo-nombre visita">
    <div class="nombre-jugador" style="color: #22c55e;">${obtenerDueñoObj(equipoV?.nombre) ?? "SIN ASIGNAR"}</div>
    <div class="nombre-pais" style="color: #64748b;">${equipoV?.nombre ?? "???"} ${equipoV ? obtenerBandera(equipoV.nombre) : ""}</div>
</div>

        </div>
${botonesAdmin}
    </div>`;
            }
            if (faseIdx === 4) {
                let campeon = obtenerGanadorBracket(4, 0); 
                if (campeon) cont.innerHTML += `<div class="campeon-box">🏆 ¡TENEMOS CAMPEÓN! 🏆<div class="campeon-dueño">${obtenerDueñoObj(campeon.nombre)} - ${obtenerBandera(campeon.nombre)} ${campeon.nombre}</div></div>`;
            }
        }
        
        function setEquipoManual(fase, matchIdx, lado, nombreEquipo) {
    let keyManual = `manual_${fase}_${matchIdx}_${lado}`;
    localStorage.setItem(keyManual, nombreEquipo);
    verFaseEliminatoria(fase); // Recarga para mostrar el cambio
}
        
        function guardarLlaveManual(fase, partido, local, visita) {

    dbLlavesManual[`${fase}_${partido}`] = {
        local: local,
        visita: visita
    };

    localStorage.setItem(
        'bosch_llaves_manual',
        JSON.stringify(dbLlavesManual)
    );

    sincronizarConNube();

    alert("Llave corregida");
}
    
    function editarLlave(fase, partido) {

    let actual = dbLlavesManual[`${fase}_${partido}`] || {};

    let local = prompt(
        "Equipo Local:",
        actual.local || ""
    );

    if (local === null) return;

    let visita = prompt(
        "Equipo Visitante:",
        actual.visita || ""
    );

    if (visita === null) return;

    guardarLlaveManual(
        fase,
        partido,
        local,
        visita
    );

    verFaseEliminatoria(fase);
}

function eliminarLlaveManual(fase, partido) {

    if (!confirm("¿Eliminar corrección manual y volver al cálculo automático?")) {
        return;
    }

    delete dbLlavesManual[`${fase}_${partido}`];

    localStorage.setItem(
        'bosch_llaves_manual',
        JSON.stringify(dbLlavesManual)
    );

    sincronizarConNube();

    verFaseEliminatoria(fase);
}
